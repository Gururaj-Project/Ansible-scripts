---
- name: ICMP Ping all servers from inventory and notify Mattermost
  hosts: localhost
  gather_facts: true
  vars:
    ping_results: []

  tasks:
    - name: Extract list of inventory hosts in group 'all_servers'
      set_fact:
        servers: "{{ groups['all_servers'] }}"

    - name: Ping each server from Ansible host
      shell: "ping -c 3 -W 2 {{ item }} > /dev/null && echo '{{ item }}: ✅ Reachable' || echo '{{ item }}: ❌ Unreachable'"
      loop: "{{ servers }}"
      register: ping_output

    - name: Collect all ping results
      set_fact:
        ping_results: "{{ ping_output.results | map(attribute='stdout') | list }}"

    - name: Format ping results for alignment
      set_fact:
        formatted_ping_output: |
          {% for line in ping_results %}
          {{ "{:<25}".format(line.split(':')[0] + ':') }} {{ line.split(':')[1] }}
          {% endfor %}

    - name: Send ICMP ping summary to Mattermost
      uri:
        url: "{{ mattermost_webhook }}"
        method: POST
        headers:
          Content-Type: "application/json"
        body_format: json
        body: |
          {
                "text": "*📡 Daily Server Ping Report - {{ ansible_date_time.date }} {{ (ansible_date_time.hour | int) % 12 if (ansible_date_time.hour | int) != 12 else 12 }}:{{ '%02d' | format(ansible_date_time.minute | int) }} {{ 'AM' if (ansible_date_time.hour | int) < 12 else 'PM' }} IST*\n```\n{{ formatted_ping_output }}\n```"

          }
